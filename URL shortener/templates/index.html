<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121620;
            --bg-gradient: linear-gradient(135deg, #1b2230 0%, #121620 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.5);
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --input-inset: inset 2px 2px 5px rgba(0, 0, 0, 0.5), inset -2px -2px 5px rgba(255, 255, 255, 0.05);
            --btn-shadow: 4px 4px 10px rgba(0,0,0,0.3), -2px -2px 10px rgba(255,255,255,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background glowing orb effect */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            opacity: 0.6;
            z-index: 0;
            border-radius: 50%;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="url"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--input-inset);
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="url"]:focus {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: var(--input-inset), 0 0 10px rgba(59, 130, 246, 0.2);
        }

        input[type="url"]::placeholder {
            color: #64748b;
        }

        button.btn-primary {
            background: var(--neon-blue);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: var(--btn-shadow), 0 0 15px var(--neon-glow);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            background: #2563eb;
            box-shadow: var(--btn-shadow), 0 0 25px rgba(59, 130, 246, 0.6);
        }
        
        button.btn-primary:active {
            transform: translateY(1px);
        }

        .result-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .short-url-link {
            color: #38bdf8;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.3s;
        }

        .short-url-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Decorative dots */
        .decorative-dots {
            display: flex;
            gap: 6px;
            position: absolute;
            top: 45px;
            right: 40px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.5;
        }

    </style>
</head>
<body>
    <div class="glow-orb"></div>

    <div class="glass-card">
        <div class="header">
            <h1>URL Shortener</h1>
        </div>
        
        <div class="decorative-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p class="subtitle">Transform your long links into sleek, easily shareable URLs instantly.</p>

        <form method="POST" action="{{ url_for('index') }}" class="input-group">
            <input type="url" name="long_url" placeholder="Paste your long URL here..." required>
            <button type="submit" class="btn-primary">Shorten URL</button>
        </form>

        {% if shortened_url %}
        <div class="result-box">
            <span class="result-label">Your Shortened URL</span>
            <a href="{{ shortened_url }}" target="_blank" class="short-url-link" id="shortUrlText">{{ shortened_url }}</a>
            <button class="btn-secondary" onclick="copyToClipboard()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy to Clipboard
            </button>
        </div>
        {% endif %}
    </div>

    <script>
        function copyToClipboard() {
            const urlText = document.getElementById('shortUrlText').innerText;
            navigator.clipboard.writeText(urlText).then(() => {
                const btn = document.querySelector('.btn-secondary');
                const originalContent = btn.innerHTML;
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                btn.style.color = '#4ade80';
                btn.style.borderColor = '#4ade80';
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2000);
            });
        }
    </script>
</body>
</html>
